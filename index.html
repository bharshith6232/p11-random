<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"></div>
<div class="container">
    <div class="card">
        <div class="icon"><i class="fa-solid fa-clover"></i></div>
        <h1>Lucky Number Game</h1>
        <p>Guess a number between <strong>0 - 9</strong></p>
        <div class="input-box">
            <label for="n"><i class="fa-solid fa-dice"></i> Enter Lucky Number</label>
            <input type="number" id="n" placeholder="Enter number">
        </div>
        <button id="click"><i class="fa-solid fa-wand-magic-sparkles"></i> Check Luck</button>
        <h2 id="result">Your Result Will Appear Here</h2>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
