<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:80vh; background-color:#ffa4a4; }
    button { border-width:0; background-color:#badfdb; border-radius:3px; width:60px; height:25px; color:#fcf9ea; }
    h1 { text-align:center; }
  </style>
</head>
<body>
  <div>
    <h1 id="t">Time</h1>
    <button id="start">start</button>
    <button id="stop">stop</button>
    <button id="reset">reset</button>
  </div>
  <script>
    const t1 = document.getElementById("t");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    const reset = document.getElementById("reset");
    let h = 0, m = 0, s = 0, l = null;
    start.addEventListener("click", () => {
      if (l !== null) return;
      l = setInterval(() => {
        console.log(h, ":", m, ":", s);
        t1.textContent = `${h}:${m}:${s}`;
        s++;
        if (s === 60) { m++; s = 0; }
        if (m === 60) { h++; s = 0; m = 0; }
      }, 1000);
    });
    stop.addEventListener("click", () => { clearInterval(l); l = null; });
    reset.addEventListener("click", () => {
      clearInterval(l); l = null;
      h = 0; m = 0; s = 0;
      t1.textContent = `${h}:${m}:${s}`;
    });
  </script>
</body>
</html>
